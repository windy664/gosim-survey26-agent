[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "rustls"] }

[profile.release]
opt-level = 2
