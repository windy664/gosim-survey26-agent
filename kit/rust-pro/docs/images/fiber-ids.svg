<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" role="img" aria-labelledby="title desc">
  <title id="title">4 × 4 光纤可指派方格编号</title>
  <desc id="desc">底行从左到右编号 0、1、2、3；往上依次为 4 到 7、8 到 11、12 到 15。行号随局部高度角增大，列号随局部方位角增大。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27548c"/>
    </marker>
  </defs>
  <rect width="640" height="630" fill="#ffffff"/>
  <g font-family="Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
    <rect x="180" y="110" width="400" height="400" fill="#e6f0ff" stroke="#17365f" stroke-width="3"/>
    <path d="M 280 110 V 510 M 380 110 V 510 M 480 110 V 510 M 180 210 H 580 M 180 310 H 580 M 180 410 H 580"
          fill="none" stroke="#315c92" stroke-width="2"/>

    <g text-anchor="middle" dominant-baseline="middle" font-size="34" font-weight="700" fill="#17365f">
      <text x="230" y="160">12</text><text x="330" y="160">13</text><text x="430" y="160">14</text><text x="530" y="160">15</text>
      <text x="230" y="260">8</text><text x="330" y="260">9</text><text x="430" y="260">10</text><text x="530" y="260">11</text>
      <text x="230" y="360">4</text><text x="330" y="360">5</text><text x="430" y="360">6</text><text x="530" y="360">7</text>
      <text x="230" y="460">0</text><text x="330" y="460">1</text><text x="430" y="460">2</text><text x="530" y="460">3</text>
    </g>

    <path d="M 108 510 V 112" fill="none" stroke="#27548c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="64" y="310" transform="rotate(-90 64 310)" text-anchor="middle" font-size="19" font-weight="600" fill="#27548c">高度角增大 / alt increases</text>
    <path d="M 180 565 H 578" fill="none" stroke="#27548c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="606" text-anchor="middle" font-size="19" font-weight="600" fill="#27548c">方位角增大 / az increases</text>
  </g>
</svg>
